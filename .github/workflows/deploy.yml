name: CI and Deploy VPS Contabo

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  NODE_VERSION: "24"
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  validate:
    name: Validate app
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: "postgresql://ci:ci@localhost:5432/album_casamento?schema=public"
      APP_BASE_URL: "http://localhost:3000"
      ADMIN_API_KEY: "ci-admin-key"
      CLIENT_HASH_SECRET: "ci-client-hash-secret"
      BUNNY_STORAGE_ENDPOINT: "https://storage.example.com/app-casamento"
      BUNNY_STORAGE_PASSWORD: "ci-storage-password"
      BUNNY_PUBLIC_BASE_URL: "https://cdn.example.com"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npm run prisma:generate

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm run test

      - name: Build
        run: npm run build

  deploy:
    name: Deploy production
    needs: validate
    runs-on: ubuntu-latest
    environment: production
    env:
      VPS_HOST: ${{ secrets.VPS_HOST }}
      VPS_USER: ${{ secrets.VPS_USER }}
      VPS_PORT: ${{ secrets.VPS_PORT || '22' }}
      APP_PATH: ${{ secrets.APP_PATH }}
      REPO_URL: ${{ secrets.REPO_URL || format('https://github.com/{0}.git', github.repository) }}
      BRANCH: main

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure SSH
        run: |
          set -euo pipefail
          : "${VPS_HOST:?Missing VPS_HOST secret}"
          : "${VPS_USER:?Missing VPS_USER secret}"
          : "${APP_PATH:?Missing APP_PATH secret}"
          install -m 700 -d ~/.ssh
          printf '%s\n' "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/vps_key
          if [ ! -s ~/.ssh/vps_key ]; then
            echo "Missing VPS_SSH_KEY secret"
            exit 1
          fi
          chmod 600 ~/.ssh/vps_key
          ssh-keyscan -p "$VPS_PORT" "$VPS_HOST" >> ~/.ssh/known_hosts

      - name: Deploy on VPS
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/vps_key -p "$VPS_PORT" "$VPS_USER@$VPS_HOST" \
            "APP_PATH='$APP_PATH' REPO_URL='$REPO_URL' BRANCH='$BRANCH' bash -s" < deploy/deploy.sh
