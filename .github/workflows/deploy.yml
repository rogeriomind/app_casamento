name: CI and Deploy VPS Contabo

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  NODE_VERSION: "24"
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  validate:
    name: Validate app
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: "postgresql://ci:ci@localhost:5432/album_casamento?schema=public"
      APP_BASE_URL: "https://casamento.example.com"
      ADMIN_API_KEY: "ci-admin-key"
      CLIENT_HASH_SECRET: "ci-client-hash-secret"
      BUNNY_STORAGE_ENDPOINT: "https://storage.example.com/app-casamento"
      BUNNY_STORAGE_PASSWORD: "ci-storage-password"
      BUNNY_PUBLIC_BASE_URL: "https://cdn.example.com"
      BUNNY_STREAM_LIBRARY_ID: "123456"
      BUNNY_STREAM_API_KEY: "ci-stream-api-key"
      BUNNY_STREAM_PULL_ZONE_HOSTNAME: "vz-example.b-cdn.net"
      BUNNY_STREAM_WEBHOOK_SECRET: "ci-stream-webhook-secret"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npm run prisma:generate

      - name: Validate shell scripts
        run: bash -n deploy/deploy.sh scripts/bootstrap-contabo.sh scripts/check-vps-port.sh

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm run test

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

  deploy:
    name: Deploy production
    needs: validate
    runs-on: ubuntu-latest
    environment: production
    env:
      VPS_HOST: ${{ secrets.VPS_HOST }}
      VPS_USER: ${{ secrets.VPS_USER }}
      VPS_PORT: ${{ secrets.VPS_PORT || '22' }}
      APP_PATH: ${{ secrets.APP_PATH }}
      RELEASE_TARBALL: /tmp/app_casamento_release.tar.gz
      COMMIT_SHA: ${{ github.sha }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure SSH
        run: |
          set -euo pipefail
          : "${VPS_HOST:?Missing VPS_HOST secret}"
          : "${VPS_USER:?Missing VPS_USER secret}"
          : "${APP_PATH:?Missing APP_PATH secret}"
          install -m 700 -d ~/.ssh
          printf '%s\n' "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/vps_key
          if [ ! -s ~/.ssh/vps_key ]; then
            echo "Missing VPS_SSH_KEY secret"
            exit 1
          fi
          chmod 600 ~/.ssh/vps_key
          ssh-keyscan -p "$VPS_PORT" "$VPS_HOST" >> ~/.ssh/known_hosts

      - name: Package release
        run: |
          set -euo pipefail
          tar \
            --exclude='.git' \
            --exclude='.env' \
            --exclude='.env*.local' \
            --exclude='node_modules' \
            --exclude='.next' \
            --exclude='coverage' \
            --exclude='artifacts' \
            --exclude='prisma/pgdata' \
            --exclude='*.log' \
            -czf "$RUNNER_TEMP/app_casamento_release.tar.gz" .

      - name: Upload release to VPS
        run: |
          set -euo pipefail
          scp -i ~/.ssh/vps_key -P "$VPS_PORT" "$RUNNER_TEMP/app_casamento_release.tar.gz" \
            "$VPS_USER@$VPS_HOST:$RELEASE_TARBALL"

      - name: Deploy on VPS
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/vps_key -p "$VPS_PORT" "$VPS_USER@$VPS_HOST" \
            "APP_PATH='$APP_PATH' RELEASE_TARBALL='$RELEASE_TARBALL' COMMIT_SHA='$COMMIT_SHA' bash -s" < deploy/deploy.sh

      - name: Remote healthcheck
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/vps_key -p "$VPS_PORT" "$VPS_USER@$VPS_HOST" \
            "APP_PATH='$APP_PATH' bash -lc 'cd \"\$APP_PATH\" && APP_PORT=\$(grep -E \"^APP_PORT=\" .env | tail -n 1 | cut -d= -f2-) && curl -fsS \"http://127.0.0.1:\$APP_PORT/api/health\"'"

      - name: Deploy report
        if: always()
        run: |
          {
            echo "## Deploy app_casamento"
            echo ""
            echo "- Commit: \`${COMMIT_SHA}\`"
            echo "- App path: \`${APP_PATH}\`"
            echo "- Environment: production"
          } >> "$GITHUB_STEP_SUMMARY"
