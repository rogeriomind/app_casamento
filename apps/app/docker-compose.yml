name: ${COMPOSE_PROJECT_NAME:?COMPOSE_PROJECT_NAME nao definido}

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-album_casamento}
      POSTGRES_USER: ${POSTGRES_USER:-album_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD nao definido no .env}
    volumes:
      - app_casamento_postgres_data:/var/lib/postgresql/data
    networks:
      - app_casamento_internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 10s
      timeout: 5s
      retries: 10

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: app-casamento-web
    restart: unless-stopped
    env_file:
      - .env
    environment:
      NODE_ENV: production
      NEXT_TELEMETRY_DISABLED: "1"
      GIT_COMMIT: ${GIT_COMMIT:-unknown}
    ports:
      - "127.0.0.1:${APP_PORT:?APP_PORT nao definido}:3000"
    networks:
      - app_casamento_internal
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/api/health').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s

volumes:
  app_casamento_postgres_data:
    name: app_casamento_postgres_data

networks:
  app_casamento_internal:
    name: app_casamento_internal
